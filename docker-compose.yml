services:
  mongo:
    image: mongo:6
    container_name: goodbooks_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: goodbooks

  api:
    build: ./app
    container_name: goodbooks_api
    ports:
      - "8000:8000"
    depends_on:
      - mongo
    environment:
      MONGO_URI: "mongodb://mongo:27017"
      DB_NAME: "goodbooks"
      API_KEY: "dev-key"
      LOG_PATH: "/app/logging.jsonl"
    volumes:
      - ./app/logging.jsonl:/app/logging.jsonl
      - ./ingest:/app/ingest 
      - ./tests:/app/tests 

volumes:
  mongo_data:
